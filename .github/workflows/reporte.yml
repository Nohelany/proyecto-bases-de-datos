name: Generar reporte CSV

on:
  schedule:
    - cron: "0 14 * * 2"
  workflow_dispatch:

jobs:
  generar-reporte:
    runs-on: ubuntu-latest

    env:
      MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Iniciar SQL Server
        run: |
          docker run \
            --name sqlserver \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" \
            -p 1433:1433 \
            -d mcr.microsoft.com/mssql/server:2022-latest

      - name: Esperar a que SQL Server esté listo
        run: |
          for i in {1..30}; do
            if docker exec sqlserver \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" \
              -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server está listo"
              exit 0
            fi
            sleep 2
          done

          docker logs sqlserver
          exit 1

      - name: Crear la base y cargar los datos
        run: |
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd"

          for archivo in create_database create_tables create_procedure create_trigger test_data
          do
            docker cp "sql/${archivo}.sql" "sqlserver:/tmp/${archivo}.sql"

            docker exec sqlserver "$SQLCMD" \
              -S localhost \
              -U sa \
              -P "$MSSQL_SA_PASSWORD" \
              -C -b \
              -i "/tmp/${archivo}.sql"
          done

      - name: Crear el archivo CSV
        run: |
          mkdir -p reportes
          echo "Producto,Existencias" > reportes/inventario.csv

          docker exec sqlserver \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C \
            -d EmpresaDB \
            -h -1 \
            -s "," \
            -W \
            -Q "SET NOCOUNT ON; SELECT Producto, Existencias FROM Inventario ORDER BY Producto;" \
            >> reportes/inventario.csv

          cat reportes/inventario.csv

      - name: Publicar CSV como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reporte-inventario
          path: reportes/inventario.csv
          retention-days: 7